<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Shashank Singh Deo</title>
  <meta name="description" content="Contact card for Shashank Singh Deo.">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div id="loader" class="loading-screen">
    <div class="loading-caption">LOADING CONTACT</div>
  </div>

  <main class="page">
    <section class="contact-hero">
      <div class="topbar">
        <a class="round-btn" href="index.html" aria-label="Back">×</a>
        <a class="round-btn" href="Shashank_Singh_Deo.vcf" aria-label="Download contact">▣</a>
      </div>

      <div class="contact-avatar-wrap">
        <img class="contact-avatar" src="assets/myimage.JPG" alt="Shashank Singh Deo">
      </div>

      <h1 class="contact-name">Shashank Singh Deo</h1>
      <p class="contact-subtitle">Robotics | Mechatronics | EV Systems</p>
    </section>

    <section class="contact-tabs">
      <a class="contact-tab" href="tel:+16232809771">
        <span class="contact-tab-icon"><img src="assets/phone.png" alt=""></span>
        <span>
          <span class="contact-tab-label">Phone</span>
          <span class="contact-tab-value">+1 623 280 9771</span>
        </span>
        
      </a>

      <a class="contact-tab" href="mailto:singhdeoshashank@gmail.com">
        <span class="contact-tab-icon"><img src="assets/email.png" alt=""></span>
        <span>
          <span class="contact-tab-label">Email</span>
          <span class="contact-tab-value">singhdeoshashank@gmail.com</span>
        </span>
      
      </a>

      <a class="contact-tab" href="https://maps.google.com/?q=Tempe%2C%20AZ%2C%20United%20States" target="_blank" rel="noopener">
        <span class="contact-tab-icon"><img src="assets/location.png" alt=""></span>
        <span>
          <span class="contact-tab-label">Location</span>
          <span class="contact-tab-value">Tempe, AZ, United States</span>
        </span>
       
      </a>

      <a class="contact-tab add-contact-tab" href="Shashank_Singh_Deo.vcf">
        <span class="contact-tab-icon"><img src="assets/addcontact.png" alt=""></span>
        <span class="contact-tab-title">Add Contact</span>
       
      </a>
    </section>
  </main>

  <script>
    window.addEventListener("load", () => {
      setTimeout(() => document.getElementById("loader").classList.add("hidden"), 650);
    });
  </script>
</body>
</html>
